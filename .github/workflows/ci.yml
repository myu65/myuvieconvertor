name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=videoai --cov-report=term-missing --cov-fail-under=70
      - run: videoai --help

  cloud-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/validate_cloud_config.py
      - name: Parse every YAML file
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path('.').rglob('*.yaml')]"
      - name: Reject obvious SQL placeholder or delimiter mistakes
        run: |
          ! grep -RInE 'TODO|YOUR_(ACCOUNT|USER|ROLE)|AUTO_RESUME[[:space:]]*=[[:space:]]*TRUE' infra/snowflake

  container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build inference image for SPCS architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: myuvieconvertor:ci
          cache-from: type=gha,scope=inference
          cache-to: type=gha,mode=max,scope=inference
      - name: Build model bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/model-bootstrap/Dockerfile
          platforms: linux/amd64
          push: false
          tags: model-bootstrap:ci
          cache-from: type=gha,scope=model-bootstrap
          cache-to: type=gha,mode=max,scope=model-bootstrap
