spec:
  containers:
    - name: model-bootstrap
      image: /MYUVIE_DB/APP/IMAGES/model-bootstrap:__IMAGE_TAG__
      env:
        MODEL_LOCK: /config/config/models.lock.yaml
        MODEL_OUTPUT: /mnt/models/releases
        MODEL_SCRATCH: /scratch/downloads
      resources:
        requests: {cpu: 4, memory: 16Gi}
        limits: {memory: 16Gi}
      volumeMounts:
        - {name: models, mountPath: /mnt/models}
        - {name: config, mountPath: /config}
        - {name: scratch, mountPath: /scratch}
  volumes:
    - name: models
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.MODELS'}
    - name: config
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.SPECS'}
    - {name: scratch, source: local}
