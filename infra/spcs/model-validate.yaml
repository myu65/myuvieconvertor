spec:
  containers:
    - name: model-validate
      image: /MYUVIE_DB/APP/IMAGES/model-bootstrap:__IMAGE_TAG__
      args: [validate]
      env:
        MODEL_LOCK: /config/config/models.lock.yaml
        MODEL_OUTPUT: /mnt/models/releases
        MODEL_RELEASE_ID: __RELEASE_ID__
        HF_HUB_OFFLINE: '1'
        HF_DATASETS_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        PIP_NO_INDEX: '1'
      resources:
        requests: {cpu: 2, memory: 8Gi}
        limits: {memory: 8Gi}
      volumeMounts:
        - {name: models, mountPath: /mnt/models}
        - {name: config, mountPath: /config}
  volumes:
    - name: models
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.MODELS'}
    - name: config
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.SPECS'}
