spec:
  containers:
    - name: videoai
      image: /MYUVIE_DB/APP/IMAGES/myuvieconvertor:__IMAGE_TAG__
      args: [run-job, --request, /mnt/media/__REQUEST_PATH__, --output-root, /mnt/media/results]
      env:
        VIDEOAI_MODEL_ROOT: /mnt/models
        VIDEOAI_MODEL_CACHE: /scratch/models
        VIDEOAI_MATERIALIZE_MODELS: '1'
        VIDEOAI_WORK_ROOT: /scratch/work
        VIDEOAI_STAGE_MOUNTS: /mnt/media:/mnt/models
        HF_HUB_OFFLINE: '1'
        HF_DATASETS_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
        PIP_NO_INDEX: '1'
      resources:
        requests: {cpu: 4, memory: 20Gi, nvidia.com/gpu: 1}
        limits: {memory: 20Gi, nvidia.com/gpu: 1}
      volumeMounts:
        - {name: models, mountPath: /mnt/models}
        - {name: media, mountPath: /mnt/media}
        - {name: scratch, mountPath: /scratch}
  volumes:
    - name: models
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.MODELS/releases/__RELEASE_ID__'}
    - name: media
      source: stage
      stageConfig: {name: '@MYUVIE_DB.APP.MEDIA'}
    - {name: scratch, source: local}
